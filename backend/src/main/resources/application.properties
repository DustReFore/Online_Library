spring.application.name=SE201_Projektni_Zadatak_Artem_Sukhomlinov_6083
spring.datasource.url=jdbc:h2:mem:online_library
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

server.port=9090

app.admin.full-name=Library Administrator
app.admin.email=admin@library.com
app.admin.password=${ADMIN_PASSWORD:Admin123!}